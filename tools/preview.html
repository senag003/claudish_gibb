<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Granskningsark – Edvin & Hedda</title>
<style>
  body { margin: 0; padding: 14px; background: #2a2838; color: #eee; font: 13px/1.4 Segoe UI, sans-serif; }
  h2 { margin: 16px 0 6px; font-size: 15px; color: #f2d25a; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 4px; }
  .cell { text-align: center; font-size: 11px; color: #bbb; }
  canvas { image-rendering: pixelated; display: block; margin: 0 auto 2px; }
  img.ref { height: 260px; display: block; border: 2px solid #444; }
  #error { background: #d8403d; color: #fff; padding: 8px; white-space: pre-wrap; display: none; font-family: monospace; }
  .note { color: #aaa; font-size: 12px; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="error"></div>
<div id="root"></div>
<script src="../js/characters.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/levels.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  const err = document.getElementById('error');
  window.addEventListener('error', e => { err.style.display = 'block'; err.textContent += e.message + ' @' + e.lineno + '\n'; });
  const root = document.getElementById('root');
  const { W, H } = window.GAME_CONST;
  const S = window.SPRITES.build(W, H);

  const h2 = t => { const e = document.createElement('h2'); e.textContent = t; root.appendChild(e); };
  const note = t => { const e = document.createElement('div'); e.className = 'note'; e.textContent = t; root.appendChild(e); };
  const row = () => { const e = document.createElement('div'); e.className = 'row'; root.appendChild(e); return e; };
  function cell(parent, img, scale, label, bg) {
    const d = document.createElement('div'); d.className = 'cell';
    const c = document.createElement('canvas'); c.width = img.width * scale; c.height = img.height * scale;
    const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = bg || '#7fb0cf'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    d.appendChild(c);
    const l = document.createElement('div'); l.textContent = label; d.appendChild(l);
    parent.appendChild(d);
  }
  function ref(parent, file, label) {
    const d = document.createElement('div'); d.className = 'cell';
    const i = document.createElement('img'); i.className = 'ref'; i.src = '../../bilder_pa_karaktarer/' + file;
    d.appendChild(i); const l = document.createElement('div'); l.textContent = label; d.appendChild(l);
    parent.appendChild(d);
  }

  // 1. Jämförelse med foton
  h2('Likhet: referensfoton bredvid idle-frame (7x) och porträtt (7x)');
  { const r = row();
    ref(r, 'Image (7).jpg', 'Foto Edvin');
    cell(r, S.edvin.right.idle[0], 7, 'Edvin idle');
    cell(r, S.edvin.portrait, 7, 'Edvin porträtt', '#2c2a3a');
    ref(r, 'Image (5).jpg', 'Foto Hedda');
    cell(r, S.hedda.right.idle[0], 7, 'Hedda idle');
    cell(r, S.hedda.portrait, 7, 'Hedda porträtt', '#2c2a3a');
  }

  // 2. Alla frames
  for (const name of ['edvin', 'hedda']) {
    h2((name === 'edvin' ? 'Edvin' : 'Hedda') + ' – alla animationsframes (4x)');
    const r = row();
    for (const a in S[name].right) S[name].right[a].forEach((f, i) => cell(r, f, 4, a + ' ' + (i + 1)));
    const r2 = row();
    cell(r2, S[name].left.run[0], 4, 'run vänster');
    cell(r2, S[name].right.idle[0], 2, 'spelstorlek (2x)');
  }

  // 3. Hönan
  h2('Hönan – frames (8x)');
  { const r = row(); for (const a in S.hen.right) S.hen.right[a].forEach((f, i) => cell(r, f, 8, a + ' ' + (i + 1))); }
  { const r = row(); ref(r, 'Image (5).jpg', 'Foto (höna)'); }

  // 4. Tiles
  h2('Tiles (5x)');
  { const r = row();
    [['grass', 0, 0], ['grass', 1, 0], ['dirt', 2, 1], ['dirt', 3, 2], ['stone', 0, 0], ['stone', 1, 1], ['cracked', 0, 0], ['crate', 0, 0], ['spikes', 0, 0], ['plate', 0, 0, 0], ['plate', 0, 0, 1], ['button', 0, 0, 0], ['button', 0, 0, 1], ['lever', 0, 0, 0], ['lever', 0, 0, 1], ['plank', 0, 0, 1]]
      .forEach(([k, x, y, a]) => cell(r, S.tile(k, x, y, a), 5, k + (a ? ' på' : ''), '#5a6070'));
  }

  // 5. Rörelsestudie
  h2('Rörelsestudie (3x): stillahopp, löpning, löphopp. Spökbild var 4:e bildruta, gula prickar = fötter varje bildruta.');
  function motion(type) {
    const cv = document.createElement('canvas'); cv.width = 448; cv.height = 120;
    const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
    const lv = { name: 't', hint: '', triggers: {}, conds: {}, map: [] };
    for (let y = 0; y < 16; y++) lv.map.push(y >= 13 ? '#'.repeat(40) : (y === 12 ? 'S..E.H' + '.'.repeat(34) : 'S' + '.'.repeat(39)));
    lv.map[12] = 'S..E.H' + '.'.repeat(33) + 'O';
    const g = new window.Game(document.createElement('canvas'), [lv], S);
    g.state = 'play'; g.sound.enabled = false;
    g.active = type === 'edvin' ? 0 : 1;
    const c = g.chars[g.active], o = g.chars[1 - g.active];
    c.x = 30; o.x = 600; g.hen.x = 620;
    const offY = 104 - 13 * 16;
    ctx.fillStyle = '#6f98b8'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    for (let x = 0; x < cv.width; x += 16) ctx.fillRect(x, 0, 1, cv.height);
    for (let y = 104; y >= 0; y -= 16) ctx.fillRect(0, y, cv.width, 1);
    ctx.fillStyle = '#78b85a'; ctx.fillRect(0, 104, cv.width, 3);
    ctx.fillStyle = '#8b5d3f'; ctx.fillRect(0, 107, cv.width, 13);
    for (let f = 0; f < 240; f++) {
      const k = { left: false, right: false, jump: false, jumpPressed: false };
      if (f === 10) k.jumpPressed = true;
      if (f >= 10 && f < 40) k.jump = true;
      if (f >= 70) k.right = true;
      if (f === 115) k.jumpPressed = true;
      if (f >= 115 && f < 150) k.jump = true;
      Object.assign(g.keys, k);
      g.update(1 / 60);
      ctx.fillStyle = 'rgba(255,240,120,0.95)';
      ctx.fillRect(Math.round(c.x + c.w / 2), Math.round(c.y + c.h + offY) - 1, 1, 1);
      if (f % 4 === 0 && c.x < cv.width - 20) {
        ctx.save(); ctx.translate(0, offY); ctx.globalAlpha = 0.85; g.drawCharacter(ctx, c, false); ctx.restore();
      }
    }
    const big = document.createElement('canvas'); big.width = cv.width * 3; big.height = cv.height * 3;
    const b = big.getContext('2d'); b.imageSmoothingEnabled = false; b.drawImage(cv, 0, 0, big.width, big.height);
    root.appendChild(big);
    note((type === 'edvin' ? 'Edvin' : 'Hedda') + ` – stats: ${JSON.stringify(window.GAME_CONST.STATS[type])}`);
  }
  motion('edvin'); motion('hedda');

  // 6. Spelskärmar
  h2('Spelskärmar (2x)');
  function shot(setup, label) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = new window.Game(cv, window.LEVELS, S);
    g.sound.enabled = false;
    setup(g); g.render();
    const big = document.createElement('canvas'); big.width = W * 2; big.height = H * 2;
    const b = big.getContext('2d'); b.imageSmoothingEnabled = false; b.drawImage(cv, 0, 0, big.width, big.height);
    root.appendChild(big); note(label);
  }
  const run = (g, n) => { for (let i = 0; i < n; i++) g.update(1 / 60); };
  shot(g => { g.state = 'title'; run(g, 30); }, 'Titelskärm (titeltext ligger som HTML ovanpå)');
  for (let i = 0; i < window.LEVELS.length; i++) {
    shot(g => { g.state = 'play'; g.loadLevel(i); run(g, 60); }, `Bana ${i + 1} start: ${window.LEVELS[i].name}`);
    shot(g => { g.state = 'play'; g.loadLevel(i); g.camX = g.cols * 16 - W; g.chars[0].x = g.cols * 16 - 200; g.chars[0].y = 0; run(g, 60); g.camX = g.cols * 16 - W; }, `Bana ${i + 1} slutet (kamera höger)`);
  }
})();
</script>
</body>
</html>
